<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Command Center</title>
    <!-- Outfit Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="screen_style.css">
</head>
<body>
    <div class="screen-container">
        <!-- TOP PANEL: Weather & Clock (40%) + WHOOP Pills (60%) -->
        <div class="top-panel">
            <!-- Clock, Date & Weather Card (40%) -->
            <header class="screen-header glass-card">
                <div class="time-block">
                    <div class="clock" id="screenClock">00:00</div>
                    <div class="date" id="screenDate">Loading date...</div>
                </div>
                
                <div class="weather-block" id="weatherBlock">
                    <div class="weather-info">
                        <div class="weather-temp" id="weatherTemp">--°C</div>
                        <div class="weather-desc" id="weatherDesc">Loading weather...</div>
                    </div>
                    <div class="weather-icon-container">
                        <i data-lucide="cloud-sun" class="weather-icon" id="weatherIcon"></i>
                    </div>
                    <!-- WHOOP Sync Button -->
                    <button class="sync-btn" id="syncBtn" onclick="triggerSync()" title="Sync WHOOP Data">
                        <i data-lucide="rotate-cw" id="syncIcon"></i>
                    </button>
                </div>
            </header>

            <!-- WHOOP Pills Card (60%) -->
            <div class="whoop-pills-card glass-card">
                <!-- Recovery -->
                <div class="pill-item">
                    <span class="pill-label">Recovery</span>
                    <div class="pill-value-container">
                        <span class="pill-val text-green" id="screenRecovery">--%</span>
                        <i data-lucide="heart-pulse" class="pill-sub-icon text-green"></i>
                    </div>
                </div>

                <!-- Sleep -->
                <div class="pill-item">
                    <span class="pill-label">Sleep</span>
                    <div class="pill-value-container">
                        <span class="pill-val text-blue" id="screenSleep">--%</span>
                        <i data-lucide="moon" class="pill-sub-icon text-blue"></i>
                    </div>
                </div>

                <!-- HRV -->
                <div class="pill-item">
                    <span class="pill-label">HRV</span>
                    <div class="pill-value-container">
                        <span class="pill-val text-pink" id="screenHRV">-- ms</span>
                        <i data-lucide="activity" class="pill-sub-icon text-pink"></i>
                    </div>
                </div>

                <!-- Resting HR -->
                <div class="pill-item">
                    <span class="pill-label">Resting HR</span>
                    <div class="pill-value-container">
                        <span class="pill-val text-orange" id="screenRHR">-- bpm</span>
                        <i data-lucide="heart" class="pill-sub-icon text-orange"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN LAYOUT GRID (3-Column Jarvis Style) -->
        <div class="main-grid">
            
            <!-- COLUMN 1: AGENDA & PRIORITIES -->
            <div class="grid-column">
                <!-- Google Calendar Agenda (Mocked) -->
                <section class="module-card glass-card">
                    <div class="module-header">
                        <i data-lucide="calendar" class="module-icon icon-blue"></i>
                        <h2>Today's Agenda</h2>
                    </div>
                    <div class="agenda-list" id="agendaList">
                        <!-- Populated by JS -->
                    </div>
                </section>

                <!-- Linear Priorities (Mocked) -->
                <section class="module-card glass-card">
                    <div class="module-header">
                        <i data-lucide="check-square" class="module-icon icon-purple"></i>
                        <h2>Linear Priorities</h2>
                    </div>
                    <div class="priorities-list" id="prioritiesList">
                        <!-- Populated by JS -->
                    </div>
                </section>
            </div>

            <!-- COLUMN 2: COMMUTE & MUSIC -->
            <div class="grid-column">
                <!-- Commute & Traffic (Mocked) -->
                <section class="module-card glass-card">
                    <div class="module-header">
                        <i data-lucide="navigation" class="module-icon icon-orange"></i>
                        <h2>Commute & Traffic</h2>
                    </div>
                    <div class="commute-list" id="commuteList">
                        <!-- Populated by JS -->
                    </div>
                </section>

                <!-- Spotify "Now Playing" (Mocked) -->
                <section class="module-card glass-card spotify-card">
                    <div class="spotify-content">
                        <div class="album-art-container">
                            <i data-lucide="music" class="fallback-art-icon"></i>
                        </div>
                        <div class="track-info">
                            <div class="track-name" id="spotifyTrack">After Hours</div>
                            <div class="track-artist" id="spotifyArtist">The Weeknd</div>
                            <div class="spotify-progress-bar">
                                <div class="spotify-progress-fill" id="spotifyProgressFill" style="width: 48%;"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- COLUMN 3: HABITS & WATER -->
            <div class="grid-column">
                <!-- Daily Habits with Streaks (Real DB) -->
                <section class="module-card glass-card">
                    <div class="module-header">
                        <i data-lucide="check-circle-2" class="module-icon icon-green"></i>
                        <h2>Daily Habits</h2>
                    </div>
                    <div class="habits-list">
                        <!-- Protein Intake -->
                        <button class="habit-btn" id="habit_protein" onclick="toggleHabit('protein')">
                            <div class="habit-info">
                                <span class="habit-title">Protein Intake</span>
                                <div class="habit-streak" id="streak_protein"></div>
                            </div>
                            <div class="habit-checkbox">
                                <i data-lucide="circle" class="habit-icon-check"></i>
                            </div>
                        </button>

                        <!-- Creatine Intake -->
                        <button class="habit-btn" id="habit_creatine" onclick="toggleHabit('creatine')">
                            <div class="habit-info">
                                <span class="habit-title">Creatine Intake</span>
                                <div class="habit-streak" id="streak_creatine"></div>
                            </div>
                            <div class="habit-checkbox">
                                <i data-lucide="circle" class="habit-icon-check"></i>
                            </div>
                        </button>

                        <!-- Stretching -->
                        <button class="habit-btn" id="habit_stretching" onclick="toggleHabit('stretching')">
                            <div class="habit-info">
                                <span class="habit-title">Stretching</span>
                                <div class="habit-streak" id="streak_stretching"></div>
                            </div>
                            <div class="habit-checkbox">
                                <i data-lucide="circle" class="habit-icon-check"></i>
                            </div>
                        </button>

                        <!-- Core -->
                        <button class="habit-btn" id="habit_core" onclick="toggleHabit('core')">
                            <div class="habit-info">
                                <span class="habit-title">Core Exercises</span>
                                <div class="habit-streak" id="streak_core"></div>
                            </div>
                            <div class="habit-checkbox">
                                <i data-lucide="circle" class="habit-icon-check"></i>
                            </div>
                        </button>
                    </div>
                </section>

                <!-- Hydration Tracker (Real DB) -->
                <section class="module-card glass-card">
                    <div class="module-header">
                        <i data-lucide="droplet" class="module-icon icon-blue"></i>
                        <h2>Hydration Tracker</h2>
                    </div>
                    <div class="water-tracker">
                        <div class="water-progress">
                            <div class="water-text">
                                <span id="waterCurrent">0</span> <span class="water-target">/ 2000 ml</span>
                            </div>
                            <div class="water-bar">
                                <div class="water-bar-fill" id="waterBarFill" style="width: 0%;"></div>
                            </div>
                        </div>
                        <div class="water-actions">
                            <button class="water-btn" onclick="addWater(250)">+250ml</button>
                            <button class="water-btn" onclick="addWater(500)">+500ml</button>
                            <button class="water-btn btn-reset" onclick="resetWater()">
                                <i data-lucide="rotate-ccw" class="btn-reset-icon"></i>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
            
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <span id="toastMessage">Updating...</span>
    </div>

    <script src="screen_app.js"></script>
</body>
</html>

app = 'whoop-data-dashboard-scarmonar15'
primary_region = 'dfw'

[build]

[env]
  DATABASE_PATH = '/data/whoop_data.db'
  TOKENS_PATH = '/data/tokens.json'
  PORT = '8080'

[[mounts]]
  source = 'whoop_dashboard_data'
  destination = '/data'
  initial_size = '1GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
